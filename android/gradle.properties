org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Auth backend (Hono + Better Auth). Must match BETTER_AUTH_URL on the server;
# its host is used for magic-link App Links.
zuno.authBaseUrl=https://api.usezuno.rest
# Google Cloud "Web application" OAuth client ID (same as GOOGLE_WEB_CLIENT_ID on the server)
#zuno.googleWebClientId=1234567890-abc.apps.googleusercontent.com
